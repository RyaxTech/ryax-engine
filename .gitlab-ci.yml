variables:
  CHARTS: "charts/ryax charts/worker-k8s charts/worker-ssh-slurm"
  FILES_TO_PREPROCESS: "charts/ryax/Chart.yaml charts/worker-k8s/Chart.yaml charts/worker-ssh-slurm/Chart.yaml"

include:
  - project: ryax-tech/ryax/ci_common
    # Update on the latest release (see https://gitlab.com/ryax-tech/ryax/ci_common/-/tags)
    ref: 6.0.1
    file: common-steps-gitlab-ci.yml

stages:
  - verify
  - deploy
  - package
  - release

pages:
  image: python:3.13
  tags: [docker]
  stage: deploy
  script:
    - pip install uv
    - cd docs
    - uv run mkdocs build --site-dir ../public
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - ~/.cache/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      variables:
        PAGES_PREFIX: "" # no prefix by default (run on the default branch)
    - if: $CI_COMMIT_BRANCH =~ "/^release-.*/" # ensure to run on the default branch (with default PAGES_PREFIX)
      variables:
        PAGES_PREFIX: $CI_COMMIT_BRANCH  # prefix with for the release branch
  pages:  # specifies that this is a Pages job and publishes the default public directory
    path_prefix: "$PAGES_PREFIX"
    expire_in: never
  environment:
    name: "Pages ${PAGES_PREFIX}"
    url: $CI_PAGES_URL
  

security_checks:
  stage: verify
  # No `image:` override on purpose: this job needs the nix, uv and cachix
  # config of the ryax-ci image that ci_common sets as the default, because
  # lint.sh builds the runner container images to scan their closures with
  # vulnix. That image already lists the ryaxtech-ci cachix as a substituter,
  # so the closures are downloaded rather than rebuilt when the runner
  # pipeline has already published them.
  tags: [docker]
  variables:
    # lint.sh runs vulture/bandit/uv-audit across every submodule and builds
    # the runner images for the vulnix scan, so they must be checked out.
    # FORCE_HTTPS rewrites the git@ SSH submodule URLs to HTTPS so the CI job
    # token can authenticate (requires the submodule projects to allow this
    # project in their CI/CD job token allowlist).
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_FORCE_HTTPS: "true"
    GIT_SUBMODULE_DEPTH: 1
    UV_LINK_MODE: copy
    UV_CACHE_DIR: .uv-cache
    # Never let uv fetch its own interpreter: those builds are not linked
    # against this image's loader. The python from ryax-ci is used instead.
    UV_PYTHON_DOWNLOADS: never
  cache:
    - key:
        files:
          - uv.lock
        prefix: $CI_RUNNER_EXECUTABLE_ARCH
      paths:
        - .uv-cache
  script:
    - uv sync --all-groups --python "$(command -v python3)"
    - export PATH="$PWD/.venv/bin:$PATH"
    - ./lint.sh
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    # Blocking on the default branch: nothing this reports may land on master
    # unnoticed.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      allow_failure: false
    # A warning on every other branch. Most of what this job reports comes from
    # upstream advisories published after the code was written, so a new CVE in
    # a dependency must not block a merge request that has nothing to do with
    # it. Same reasoning as check_helm_deps below.
    - when: on_success
      allow_failure: true

check_helm_deps:
  stage: verify
  image: python:3.13
  tags: [docker]
  # Upstream Helm charts release very often, so a drift here should warn without
  # blocking unrelated merge requests. Drop `allow_failure` to make it blocking.
  allow_failure: true
  variables:
    # Full history + tags are required: the check reads the previous release's
    # Chart.lock/Chart.yaml (via `git show <tag>:...`) to cap upgrades at one
    # major per release. A shallow clone would hide older release tags.
    GIT_DEPTH: 0
    UV_LINK_MODE: copy
    UV_CACHE_DIR: .uv-cache
  cache:
    - key:
        files:
          - uv.lock
        prefix: $CI_RUNNER_EXECUTABLE_ARCH
      paths:
        - .uv-cache
  before_script:
    # skopeo lists tags for OCI (oci://) charts; the check degrades gracefully
    # to "skipped" if it is missing, so do not fail the job when it cannot install.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends skopeo || echo "skopeo unavailable, OCI charts will be skipped"
    - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
    - pip install uv
    - uv sync
  script:
    - export PATH="$PWD/.venv/bin:$PATH"
    # Exits 1 when a locked dependency is behind its recommended version.
    - python jef.py check_helm_deps
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

verify_helm_charts:
  extends: .verify_helm_charts
  # Exhaustive list of charts here for linter
  variables:
    CHARTS: |-
      charts/ryax
      charts/ryax/subcharts/action-builder
      charts/ryax/subcharts/authorization
      charts/ryax/subcharts/common-resources
      charts/ryax/subcharts/datastore
      charts/ryax/subcharts/front
      charts/ryax/subcharts/intelliscale
      charts/ryax/subcharts/registry
      charts/ryax/subcharts/repository
      charts/ryax/subcharts/runner
      charts/ryax/subcharts/studio
      charts/worker-k8s
      charts/worker-ssh-slurm

package_helm_charts:
  extends: .package_helm_charts
  needs:
    - verify_helm_charts

staging_charts:
  extends: .staging_charts

release_charts:
  extends: .release_charts
  needs:
    - package_helm_charts
