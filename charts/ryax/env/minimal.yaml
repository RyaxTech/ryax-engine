global:
  # -- Override the container registry globaly. Useful to use development using registry.ryax.org/dev or for airgapped env
  # imageRegistry:
  # imagePullSecrets:
  
  nodeSelector: {}
  # -- Leave empty to use the default storage class
  defaultStorageClass: ""

  # -- Ryax specific configuration
  ryax:
    # -- Global log level, can be overriden locally
    logLevel: error

  monitoring:
    enabled: false

  tls:
    enabled: false
    # environment: "development" # development or production
    # hostname: "local.ryax.io" # must be a valid dns address

  # -- Needed by bitnami to avoid https://github.com/bitnami/charts/issues/30850
  security:
    allowInsecureImages: true

# -- All common configuration and secrets are created here
common-resources:
  certManager:
    enabled: false

registry:
  # Without an Ingress the kubelet pulls action images through the NodePort,
  # which is why runner.internalRegistry defaults to 127.0.0.1:30012. Leave both
  # alone unless you know why you are changing them: the address the Runner has
  # at the first deploy of an action is the one recorded in its image reference.
  ingress:
    enabled: false
  persistence:
    enabled: true
    pvcSize: 20Gi
  priorityClass: backbone
  
datastore:
  pvcSize: 1Gi
  priorityClass: backbone
  
action-builder:
  persitence:
    enabled: false
  nix:
    storeSize: 4Gi
  extraEnv:
    - name: RYAX_NIX_GARBAGE_COLLECT_ENABLED
      value: ""
    
minio:
  metrics:
    enabled: false

rabbitmq:
  metrics:
    enabled: false
  persistence:
    enabled: false

kube-prometheus-stack:
  enabled: false

tempo:
  enabled: false

loki:
  enabled: false

traefik:
  metrics:
    prometheus:
      serviceMonitor:
        enabled: false
