global:
  # -- Override the container registry globaly. Useful for airgapped env
  imageRegistry: ""
  # -- Inject the pull secret:
  # https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  imagePullSecrets:
    - name: ryax-dev-pull-secret
    
  nodeSelector: {}
  # -- Leave empty to use the default storage class
  defaultStorageClass: ""

  # -- Ryax specific configuration
  ryax:
    # -- Global log level, can be overriden locally
    logLevel: debug
    # -- Namespace where user's actions are deployed
    userNamespace: "ryaxns-execs"

  monitoring:
    enabled: true

  tls:
    enabled: true
    environment: "development" # development or production
    hostname: "local.ryax.io" # must be a valid dns address


  # -- Needed by bitnami to avoid https://github.com/bitnami/charts/issues/30850
  security:
    allowInsecureImages: true

# Ryax Services
front:
  image:
    tag: master
    registry: registry.ryax.org/dev
    pullPolicy: Always

action-builder:
  image:
    tag: master
    registry: registry.ryax.org/dev
    pullPolicy: Always

runner:
  image:
    tag: master
    registry: registry.ryax.org/dev
    pullPolicy: Always

authorization:
  image:
    tag: master
    registry: registry.ryax.org/dev
    pullPolicy: Always

webui:
  image:
    tag: master
    registry: registry.ryax.org/dev
    pullPolicy: Always

repository:
  image:
    tag: master
    registry: registry.ryax.org/dev
    pullPolicy: Always

studio:
  image:
    tag: master
    registry: registry.ryax.org/dev
    pullPolicy: Always

intelliscale:
  image:
    tag: master
    registry: registry.ryax.org/dev
    pullPolicy: Always

minio:
  persistence:
    enabled: true
    size: 100Gi

rabbitmq:
  persistence:
    enabled: false

registry:
  persistence:
    enabled: true
    pvcSize: 200Gi

datastore:
  pvcSize: 2Gi
 
