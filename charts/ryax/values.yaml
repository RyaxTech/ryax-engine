global:
  # -- Override the container registry globaly. Useful to use development using registry.ryax.org/dev or for airgapped env
  imageRegistry: 
  imagePullSecrets: []

  nodeSelector: {}
  # -- Leave empty to use the default storage class
  defaultStorageClass: ""

  # -- Ryax specific configuration
  ryax:
    # -- Global log level, can be overriden locally
    logLevel: warning
    # -- Namespace where user's actions are deployed
    userNamespace: "ryaxns-execs"

  monitoring:
    enabled: true
    # -- WARN: Be sure to use tpl in sub chart to inject release name
    otlpEndpoint: "{{ .Release.Name }}-tempo:4317"

  ingress:
    # -- IngressClass for the Ryax Ingresses, overridable per service with
    # `<subchart>.ingress.className`. Defaults to the bundled Traefik's own
    # class; point it at another controller, or turn the Ingresses off with
    # `<subchart>.ingress.enabled=false`, when Ryax is not fronted by it.
    # WARN: Be sure to use tpl in sub chart to inject release name
    className: "{{ .Release.Name }}-traefik"

  tls:
    enabled: false
    # -- development or production
    environment: 
    # -- must be a valid FQDN like "local.ryax.io", leave empty for local install
    hostname: ""
    
  # -- Needed by bitnami to avoid https://github.com/bitnami/charts/issues/30850
  security:
    allowInsecureImages: true

  # Be aware that the folowing values are shared amoung the services,
  # but they are defined as static values to avoid unnecessary configuration overhead:
  # 
  # datastoreSecret: ryax-datastore-secret
  # internalRegistry: ryax-registry:5000
  # actionRegistrySecret: ryax-registry-creds-secret
  # brokerSecret: ryax-broker-secret
  # authorizationUrl: ryax-authorization:8080
  # filestoreName: ryax-filestore
  # filestoreSecret: ryax-minio-secret
  # internalRegistry: 127.0.0.1:30012
  # jwtSecret: api-jwt-secret-key
  # releaseMarker: ryax-release-marker
  # -- Credential secrets the chart generates itself (database, broker, JWT,
  # encryption keys, registry htpasswd and TLS). Set to false to supply every one
  # of them yourself -- sealed-secrets, external-secrets, or a plain kubectl
  # create -- under the names listed in the values below. This is what a GitOps
  # deployment wants: the generated values come from `lookup()`, which returns
  # nothing when the chart is rendered without a cluster connection (`helm
  # template`, ArgoCD's and Flux's repo servers), so every render would otherwise
  # mint fresh passwords and roll them out to running pods.
  # @section -- Global
  secrets:
    create: true
  # -- Tolerations injected as-is into every Ryax pod
  # (https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/).
  # Required to run Ryax on tainted nodes; override per subchart with its own
  # `tolerations`.
  # Example:
  #   - key: mycompany/mesh
  #     operator: Exists
  #     effect: NoSchedule
  # @section -- Global
  tolerations: []
  # -- Affinity injected as-is into every Ryax pod. Override per subchart with its
  # own `affinity`.
  # @section -- Global
  affinity: {}

registry:
  credentials:
    enabled: true
    pullSecretName: ryax-registry-creds-secret
  ingress:
    enabled: false
  persistence:
    enabled: true
    pvcSize: 20Gi
  priorityClass: backbone

datastore:
  pvcSize: 2Gi
  priorityClass: backbone
  
front:
  enabled: true

action-builder:
  priorityClass: "microservices"
  # -- Only necessary if registry.credentials.enabled=true
  actionRegistrySecret: ryax-registry-creds-secret
  persitence:
    enabled: true
  nix:
    storeSize: 100Gi

runner:
  priorityClass: microservices

# IntelliScale runs centrally at the master site (multi-site). It consumes
# execution metrics and publishes recommendations over the broker. Set
# intelliscale.enabled=false to opt out.
intelliscale:
  enabled: true
  priorityClass: microservices
  # brokerSecret defaults to "ryax-broker-secret" in the subchart.

studio:
  priorityClass: microservices

repository:
  priorityClass: microservices

repository:
  priorityClass: microservices

minio:
  image:
    repository: bitnamilegacy/minio
  console:
    # -- enable this to add internal Web console to browse Minio content
    enabled: false
    image:
      repository: bitnamilegacy/minio-object-browser
  auth:
    existingSecret: ryax-minio-secret
  commonLabels:
    ryax.tech/resource-name: minio
  containerSecurityContext:
    runAsUser: 1200
  metrics:
    enabled: true
  mode: standalone
  persistence:
    enabled: true
    size: 20Gi
  podSecurityContext:
    fsGroup: 1200
  priorityClassName: backbone
  resources:
    limits:
      memory: 1000Mi
    requests:
      cpu: 100m
      memory: 1000Mi
  serviceAccount:
    create: false
  defaultInitContainers:
    # -- If you move data to NFS, enable this to force the permission of minio to match the one from ryax user (UID: 1200)
    volumePermissions:
      enabled: false

rabbitmq:
  image:
    repository: bitnamilegacy/rabbitmq
  auth:
    existingErlangSecret: ryax-broker-cookie
    existingPasswordSecret: ryax-broker-secret
    tls:
      autoGenerated: false
      enabled: false
    username: ryaxmq
  resources:
    limits:
      memory: 1000Mi
    requests:
      cpu: 100m
      memory: 500Mi
  clustering:
    enabled: false
  extraPlugins: ""
  fullnameOverride: ryax-broker
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  persistence:
    enabled: true
    size: 1Gi
    # storageClass: local-path
  plugins: rabbitmq_management
  priorityClassName: backbone
  rbac:
    create: false
  serviceAccount:
    create: false
  ulimitNofiles: ""

# -- Configuration for kube-prometheus-chart
kube-prometheus-stack:
  enabled: true
  crds:
    enabled: true
    upgradeJob:
      enabled: true
      forceConflicts: true
  prometheusOperator:
    # -- Node selector for the prometheus 
    # nodeSelector: 
    priorityClassName: monitoring
        
  prometheus:
    prometheusSpec:
      priorityClassName: monitoring
      serviceMonitorSelectorNilUsesHelmValues: false
      additionalScrapeConfigs:
      - job_name: 'kubernetes-gpu-pod'
        scrape_interval: 5s
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: nvidia-dcgm-exporter
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: kube-system
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: '9400'
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_container_port_number]
            action: replace
            target_label: __address__
            separator: ':'
      # -- inject more labels here like
      # hostedOn: mycloud.com
      # instanceType: production
      externalLabels:
        ryax-version: "{{ .Chart.Version }}"
        cluster: "{{ .Values.global.tls.hostname }}"
      
      # -- Remote write is disabled by default
      # remoteWrite:
      #   url: https://metrics.ryax.org/insert/0/prometheus
    storage:
      volumeClaimTemplate:
        spec:
          # -- Select a storage class for prometheus metrics storage
          # storageClassName: "{{ .Values.global.defaultStorageClass }}"
          resources:
            requests:
              storage: 10Gi
              
  additionalPrometheusRulesMap:
    resource-usage:
      groups:
        - name: resource-usage
          rules:
            - alert: RyaxContainerCpuUsage
              expr: (sum(rate(container_cpu_usage_seconds_total{container=~"ryax-.*"}[15m])) BY (instance, name) * 100) > 95
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: |
                  {{ `"Container CPU usage (instance {{ $labels.instance }})"` }}
                description: |
                  {{ `"Container CPU usage is above 95% for 15 minutes\n  VALUE = {{ $value }}\n  LABELS: {{ $labels }}"` }}
                dashboards: "{{ .Values.dashboardUrl }}/6581e46e4e5c7ba40a07646395ef7b23"
            - alert: RyaxContainerVolumeUsage
              expr: (1 - (sum(container_fs_inodes_free{container=~"ryax-.*"}) BY (instance) / sum(container_fs_inodes_total{container=~"ryax-.*"}) BY (instance)) * 100) > 80
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: |
                  {{ `"Container Volume usage (instance {{ $labels.instance }})"` }}
                description: |
                  {{ `"Container Volume usage is above 80%\n  VALUE = {{ $value }}\n  LABELS: {{ $labels }}"` }}
                # TODO Create a dashborad for volume usage
            - alert: RyaxContainerVolumeIoUsage
              expr: (sum(container_fs_io_current{container=~"ryax-.*"}) BY (instance, name) * 100) > 80
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: |
                  {{ `"Container Volume IO usage (instance {{ $labels.instance }})"` }}
                description: |
                  {{ `"Container Volume IO usage is above 80%\n  VALUE = {{ $value }}\n  LABELS: {{ $labels }}"` }}
                # TODO Create a dashborad for volume IO


    meta-monitoring:
      groups:
        - name: meta-monitoring
          rules:
            - alert: InstanceDown
              # Condition for alerting
              expr: up == 0
              for: 5m
              # Annotation - additional informational labels to store more information
              annotations:
                summary: |
                  {{ `'Instance {{ $labels.instance }} down'` }}
                description: |
                  {{ `'{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute.'` }}
                dashboards: "{{ .Values.dashboardUrl }}/HKcS6KdGk"
              # Labels - additional labels to be attached to the alert
              labels:
                severity: critical
  alertmanager:
    enabled: false

  kubeProxy:
    service:
      selector:
        # -- Needed on AKS to properly select the pod and avoid KubeProxyDown alerts
        component: kube-proxy
  
  # -- Configuration for grafana component
  grafana:
    enabled: true

    grafana.ini:
      users:
        allow_sign_up: false
        allow_org_create: false
      auth.anonymous:
        enabled: false

    ingress:
      enabled: false
          
    persistence:
      enabled: true
      size: 1Gi

    plugins:
      - grafana-piechart-panel
      - grafana-clock-panel
      - vonage-status-panel

    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
      datasources:
        enabled: true
        label: grafana_datasource

    admin:
      # -- This secret is created by common-resources
      existingSecret: grafana-credentials
      userKey: admin-user
      passwordKey: admin-password

tempo:
  enabled: true
  priorityClassName: monitoring
  persistence:
    enabled: true
    size: "10Gi"

# -- Loki is an external dependency that provides log collection on Kubernetes.
loki:
  enabled: true
  resultsCache:
    enabled: false
  test:
    enabled: false
  chunksCache:
    enabled: false
  lokiCanary:
    enabled: false

  deploymentMode: SingleBinary
  singleBinary:
    # -- Avoid Loki using too many resources: Increase this if you experience OOM errors
    resources:
      requests:
        cpu: 0.5
        memory: 512Mi
      limits:
        cpu: 1
        memory: 512Mi
    replicas: 1
    # Fix cluster node discovery issues
    extraArgs:
      - -config.expand-env=true
    extraEnv:
      - name: POD_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
  read:
    replicas: 0
  backend:
    replicas: 0
  write:
    replicas: 0
  gateway:
    enabled: false

  loki:
    commonConfig:
      replication_factor: 1
    storage:
      type: 'filesystem'
    schemaConfig:
      configs:
      - from: "2024-01-01"
        store: tsdb
        index:
          prefix: loki_index_
          period: 24h
        # -- storing on filesystem, so there's no real persistence here.
        # if you want to persist logs on S3 change this config.
        # See https://grafana.com/docs/loki/latest/operations/storage/
        object_store: filesystem
        schema: v13

    # Extra config
    # Fix loki-memberlist unreachable error, see this issue fo rmore details:
    # https://github.com/grafana/loki/issues/6370#issuecomment-2260528852
    extraMemberlistConfig:
      bind_addr:
        - ${POD_IP}
    # Avoid too many logs from loki itself
    server:
      log_level: warn
    # -- Avoid "No Org id error" in Grafana datasource.
    # See Helm chart documentation for more details
    auth_enabled: false
    limits_config:
      # -- Keep only one week of logs
      retention_period: 7d
      # -- Increase the number of labels or logs from ryax services can be ignored
      max_label_names_per_series: 30
    # -- Adding this to avoid "too many outstanding requests" errors on the API
    # See https://github.com/grafana/loki/issues/4613
    query_scheduler:
      max_outstanding_requests_per_tenant: 2048

# -- Alloy is an external dependency that provides log collection on Kubernetes.
# It replaces the deprecated Promtail.
alloy:
  serviceMonitor:
    enabled: true
  # -- No need for the PodLogs CRD: logs are collected from the node filesystem
  crds:
    create: false
  controller:
    # -- Be sure that Alloy runs on every node
    tolerations:
      - effect: NoSchedule
        operator: Exists
  alloy:
    # -- Mount /var/log from the host to read the pod log files, as Promtail did
    mounts:
      varlog: true
    # -- Required to read the pod log files on the host
    securityContext:
      runAsUser: 0
      runAsGroup: 0
    configMap:
      # -- Equivalent of the previous Promtail configuration: collect the logs
      # of all the pods of the node and push them to Loki.
      # The loki.write url is templated to match the release name.
      content: |-
        // Collect logs only from the pods of the node Alloy runs on.
        // K8S_NODE_NAME is set by the Alloy chart.
        discovery.kubernetes "pods" {
          role = "pod"
          selectors {
            role  = "pod"
            field = "spec.nodeName=" + sys.env("K8S_NODE_NAME")
          }
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pods.targets

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_node_name"]
            target_label  = "node_name"
          }
          rule {
            source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
            separator     = "/"
            target_label  = "job"
          }
          // Map the pod labels then drop some to avoid the "too many labels" error
          rule {
            action = "labelmap"
            regex  = "__meta_kubernetes_pod_label_(.+)"
          }
          rule {
            action = "labeldrop"
            regex  = "app_kubernetes_io_(.+)"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
            separator     = "/"
            replacement   = "/var/log/pods/*$1/*.log"
            target_label  = "__path__"
          }
        }

        local.file_match "pod_logs" {
          path_targets = discovery.relabel.pod_logs.output
        }

        loki.source.file "pod_logs" {
          targets    = local.file_match.pod_logs.targets
          forward_to = [loki.process.pod_logs.receiver]
        }

        loki.process "pod_logs" {
          // Parse the containerd (CRI) log format
          stage.cri {}
          forward_to = [loki.write.loki.receiver]
        }

        loki.write "loki" {
          endpoint {
            url = "{{ printf "http://%s-loki:3100/loki/api/v1/push" .Release.Name }}"
          }
        }


traefik:
  deployment:
    enabled: true
  ingressClass:
    # -- Do NOT set this to true. `ingressclass.kubernetes.io/is-default-class`
    # is cluster-scoped, so the bundled Traefik would claim every Ingress in
    # every namespace that does not name a class -- including ones belonging to
    # unrelated applications, which it then serves on whatever address its
    # Service holds. Ryax's own Ingresses name this class explicitly through
    # `global.ingress.className`, so they do not need it.
    isDefaultClass: false
  # -- set this to force Traefik on a node pool
  nodeSelector: 
  priorityClassName: backbone
  # -- The Service is a LoadBalancer by default, which on a cluster running
  # MetalLB or kube-vip takes the shared ingress address on 80/443. Set
  # `service.spec.type: ClusterIP` when something else fronts the cluster.
  # WARN: the key is `service.spec.type`. Traefik 41.x moved it into a free-form
  # `spec` block and the old `service.type` is silently ignored, which leaves the
  # Service a LoadBalancer while the values file says otherwise.
  metrics:
    prometheus:
      # Avoid errors when runnning helm template
      disableAPICheck: true
      serviceMonitor:
        enabled: true
