suite: Registry credentials, pull secrets and certificate
# The registry's htpasswd, the pull secret of every namespace that pulls from
# it, and the self-signed certificate of the node-port setup. Each reads the
# live secret with lookup() first: the htpasswd hash has a random salt, and the
# certificate is trusted by every node's container runtime, so neither may
# change on an upgrade.
templates:
  - templates/secrets.yaml
release:
  name: ryax
  namespace: ryaxns
set:
  credentials.username: u
  credentials.password: p
tests:
  - it: creates none with global.secrets.create off
    set:
      global.secrets.create: false
    asserts:
      - hasDocuments:
          count: 0
  - it: creates the credentials, a pull secret per namespace and the certificate
    set:
      credentials.injectInNamespaces: [builds]
    asserts:
      - hasDocuments:
          count: 5
      - equal:
          path: metadata.name
          value: ryax-registry-credentials
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: builds
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: ryaxns
        documentIndex: 2
      - equal:
          path: metadata.namespace
          value: ryaxns-execs
        documentIndex: 3
      - isKind:
          of: Secret
        documentIndex: 4
      - equal:
          path: type
          value: kubernetes.io/tls
        documentIndex: 4
  - it: creates only the certificate with credentials.createSecret off
    set:
      credentials.createSecret: false
    asserts: &certOnly
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: ryax-registry-cert
  - it: creates only the certificate with the credentials disabled
    set:
      credentials.enabled: false
    asserts: *certOnly
  - it: creates no certificate with certSecretCreate off
    set:
      certSecretCreate: false
    asserts: &noCert
      - hasDocuments:
          count: 3
      - notEqual:
          path: type
          value: kubernetes.io/tls
  - it: creates no certificate behind an Ingress, which brings its own
    set:
      ingress.enabled: true
      ingress.hostname: reg.example.com
    asserts: *noCert

  - it: hashes the password with bcrypt
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data.htpasswd
          decodeBase64: true
          pattern: ^u:\$2a\$10\$
  - it: authenticates the pull secrets with the username and password
    documentIndex: 1
    asserts:
      - matchRegex:
          path: data[".dockerconfigjson"]
          decodeBase64: true
          pattern: '"127\.0\.0\.1:30012": \{"auth": "dTpw"\}'
      - matchRegex:
          path: data[".dockerconfigjson"]
          decodeBase64: true
          pattern: '"ryax-registry:5000": \{"auth": "dTpw"\}'
  - it: generates a self-signed certificate
    documentIndex: 3
    asserts:
      - matchRegex:
          path: data["tls.crt"]
          decodeBase64: true
          pattern: ^-----BEGIN CERTIFICATE-----
      - matchRegex:
          path: data["tls.key"]
          decodeBase64: true
          pattern: ^-----BEGIN RSA PRIVATE KEY-----

  - it: keeps the live htpasswd, pull secret and certificate
    set:
      credentials.password: changed
    kubernetesProvider:
      scheme:
        v1/Secret:
          gvr: {version: v1, resource: secrets}
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata: {name: ryax-registry-credentials, namespace: ryaxns}
          data:
            htpasswd: aHRwYXNzd2QtbGluZQ==      # htpasswd-line
        - apiVersion: v1
          kind: Secret
          metadata: {name: ryax-registry-creds-secret, namespace: ryaxns}
          data:
            .dockerconfigjson: eyJhdXRocyI6e319  # {"auths":{}}
        - apiVersion: v1
          kind: Secret
          metadata: {name: ryax-registry-cert, namespace: ryaxns}
          data:
            tls.crt: Q0VSVA==                    # CERT
            tls.key: S0VZ                        # KEY
    asserts:
      - equal:
          path: data.htpasswd
          value: aHRwYXNzd2QtbGluZQ==
        documentIndex: 0
      - equal:
          path: data[".dockerconfigjson"]
          value: eyJhdXRocyI6e319
        documentIndex: 1
      - equal:
          path: data["tls.crt"]
          value: Q0VSVA==
        documentIndex: 3
      - equal:
          path: data["tls.key"]
          value: S0VZ
        documentIndex: 3
  - it: builds the pull secret of a namespace that has none from the current values
    kubernetesProvider:
      scheme:
        v1/Secret:
          gvr: {version: v1, resource: secrets}
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata: {name: ryax-registry-creds-secret, namespace: ryaxns}
          data:
            .dockerconfigjson: eyJhdXRocyI6e319  # {"auths":{}}
    documentIndex: 2
    asserts:
      - equal:
          path: metadata.namespace
          value: ryaxns-execs
      - matchRegex:
          path: data[".dockerconfigjson"]
          decodeBase64: true
          pattern: '"auth": "dTpw"'
