global:
  # -- Add nodeSelector injected as-is (https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector)
  # @section -- Global
  nodeSelector: {}
  # -- Global container image registry
  # @section -- Global
  imageRegistry:
  # -- Global container registry secret names as an array
  # Example:
  #   - name: myPullSercret
  # @section -- Global
  imagePullSecrets: []
  # --	Global default StorageClass for Persistent Volume(s)
  # @section -- Global
  defaultStorageClass: ""

  monitoring:
    # -- Enables service monitoring
    # @section -- Global
    enabled: false

  ryax:
    userNamespace: ryaxns-execs

  tls:
    enabled: false
  # -- Credential secrets the chart generates itself (database, broker, JWT,
  # encryption keys, registry htpasswd and TLS). Set to false to supply every one
  # of them yourself -- sealed-secrets, external-secrets, or a plain kubectl
  # create -- under the names listed in the values below. This is what a GitOps
  # deployment wants: the generated values come from `lookup()`, which returns
  # nothing when the chart is rendered without a cluster connection (`helm
  # template`, ArgoCD's and Flux's repo servers), so every render would otherwise
  # mint fresh passwords and roll them out to running pods.
  # @section -- Global
  secrets:
    create: true
  # -- Tolerations injected as-is into every Ryax pod
  # (https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/).
  # Required to run Ryax on tainted nodes; override per subchart with its own
  # `tolerations`.
  # Example:
  #   - key: mycompany/mesh
  #     operator: Exists
  #     effect: NoSchedule
  # @section -- Global
  tolerations: []
  # -- Affinity injected as-is into every Ryax pod. Override per subchart with its
  # own `affinity`.
  # @section -- Global
  affinity: {}
  ingress:
    # -- IngressClass the Ingress of this service targets, overridden by the
    # local `ingress.className`. The umbrella chart points it at the bundled
    # Traefik; empty means no class, i.e. whichever controller claims the
    # cluster's default.
    # WARN: templated with the release name, render it through tpl
    # @section -- Global
    className: ""

# -- container image name and version
image:
  tag: "3"
  registry: docker.io
  repository: registry
  digest: ""
  # -- Specify a imagePullPolicy
  # ref: https://kubernetes.io/docs/concepts/containers/images/#pre-pulled-images
  pullPolicy: IfNotPresent

registryCertSetup:
  # -- Rewrite containerd's registry config on every node (a DaemonSet) so the
  # kubelet trusts the registry's self-signed certificate, and mount that
  # certificate into the registry. Unset means `not ingress.enabled`: only
  # needed when no Ingress serves the registry with a trusted certificate.
  # Set it explicitly to keep the two concerns apart -- turning the Ingress off
  # for a Gateway API or service-mesh setup should not silently start
  # rewriting node configuration.
  # Only works with containerd, and on k3s only with a mutable config.
  enabled:
  image:
    tag: "1.1"
    registry: registry.ryax.org/release
    repository: registry-cert-setup
    # -- Specify a imagePullPolicy
    # ref: https://kubernetes.io/docs/concepts/containers/images/#pre-pulled-images
    pullPolicy: IfNotPresent

# -- priority class for the pods
priorityClass: # "backbone"

persistence:
  enabled: true
  # -- storage size
  pvcSize: "10Gi"
  # -- leave empty for the default value
  storageClass:

servicePort: 5000
# -- This is required for the kubelet to pull the image from
# localhost. This is only used if the ingress is disabled.
# This is useful in private clusters because image pull is done by the kubelet that do not have access to
# internal services. Using a node port allows to give acess to any host as localhost.
# Value in range 30000-32767
nodePort: 30012
# -- Metrics port used by monitoring
debugPort: 5001


ingress:
  # -- Create a public Ingress to access the repository.
  # *WARNING*: If disabled it is replaced by a self-sign certificate that is
  # injected with DaemonSet on all nodes (Only works with containerd and k3s with
  # mutable config)
  # *WARNING*: kubelet will be able to pull the images only if a
  # valid certificate is associated to the Ingress
  enabled: false

  # -- Value for `spec.ingressClassName`. Left empty, the Ingress is claimed by
  # whichever IngressClass is marked default in the cluster.
  className: ""

  # -- hostname of the registry required if ingress is enabled
  # Must be the cluster FQDN like "registry.cluster.example.io" use
  # Use to create a valid certificate and to create docker pull credentials
  hostname:

  # -- Name of the secret that contains the TLS certificate (not provisionned by this chart)
  certSecret: "ryax-registry-ingress-cert"

  # -- Custom annotation for the Ingress.
  # Additional annotation.
  # WARNING: when global.tls.enabled, certManager annotation is already added for you
  annotations: {}

# -- Create the self-signed registry certificate secret `<fullname>-cert`, used
# when no ingress serves the registry. Set to false to provide it yourself with
# the `tls.crt` and `tls.key` keys; the generated one is not reproducible
# across renders.
certSecretCreate: true

credentials:
  # -- Enable credentials, disable this to make your registry public
  enabled: true
  # -- Create the credentials and pull secrets. Set to false to provide them
  # yourself: `<fullname>-credentials` must carry `htpasswd` and
  # `credentials.pullSecretName` must carry `.dockerconfigjson`. The htpasswd
  # hash uses a random bcrypt salt, so it is not reproducible across renders.
  createSecret: true
  # -- registry access default username
  # WARNING: Change this in production, this is unsecure !
  username: ryax
  # -- registry access default password
  # WARNING: Change this in production, this is unsecure !
  password: 'ryaxPassw0rd?'
  # -- Namepace where the registry pull secret should be injected
  # The installation current namespace and the global.ryax.userNamespace is added by default
  injectInNamespaces: []
  # -- Name of the pull secret injected in the namespaces
  pullSecretName: ryax-registry-creds-secret

# -- Recommended resource requirement
# @section -- Resource Settings
# Example:
#  resources:
#    requests:
#      memory: "500Mi"
#      cpu: "100m"
#    limits:
#      memory: "750Mi"
resources: {}

garbageCollect:
  imagePullPolicy: "IfNotPresent"
  # -- Do not add request unless you are sure. The lack of resource it might make
  # the job fail forever...
  resources: {}

# -- Tolerations injected as-is, overriding `global.tolerations` when set
# (https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/).
tolerations: []
# -- nodeSelector injected as-is, overriding `global.nodeSelector` when set
# (https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector)
nodeSelector: {}

# -- Affinity injected as-is, overriding `global.affinity` when set.
affinity: {}
