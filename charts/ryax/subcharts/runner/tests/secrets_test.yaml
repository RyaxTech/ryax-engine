suite: Encryption key secret
# The key encrypts what the service stores at rest, so losing it on an upgrade
# makes it unreadable. The chart reads the live secret with lookup() first;
# without one it takes fernetEncryptionKey, then a random key.
templates:
  - templates/secrets.yaml
release:
  namespace: ryaxns
tests:
  - it: is not created with global.secrets.create off
    set:
      global.secrets.create: false
    asserts:
      - hasDocuments:
          count: 0
  - it: is not created with encryptionKeySecretCreate off
    set:
      encryptionKeySecretCreate: false
    asserts:
      - hasDocuments:
          count: 0

  - it: generates a Fernet key, 32 bytes in base64
    asserts:
      - equal:
          path: metadata.name
          value: runner-encryption-key
      - matchRegex:
          path: stringData.encryption-key
          pattern: ^[A-Za-z0-9+/]{43}=$
  - it: takes fernetEncryptionKey
    set:
      fernetEncryptionKey: given-key
    asserts:
      - equal:
          path: stringData.encryption-key
          value: given-key
  - it: keeps the live key over fernetEncryptionKey
    set:
      fernetEncryptionKey: given-key
    kubernetesProvider:
      scheme:
        v1/Secret:
          gvr: {version: v1, resource: secrets}
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata: {name: runner-encryption-key, namespace: ryaxns}
          data:
            encryption-key: ZXhpc3Rpbmcta2V5    # existing-key
    asserts:
      - equal:
          path: stringData.encryption-key
          value: existing-key
