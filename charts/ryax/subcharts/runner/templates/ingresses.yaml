{{- $tlsEnabled := .Values.global.tls.enabled }}
{{- $hostname := .Values.global.tls.hostname }}
{{- /* Hosts the rules match; empty matches any host (roadmap#1448). */}}
{{- $ingressHosts := .Values.global.ingress.hosts | default list }}
{{- if and $ingressHosts $hostname (not (has $hostname $ingressHosts)) }}
{{- fail (printf "global.tls.hostname (%s) must be one of global.ingress.hosts (%s)" $hostname (join ", " $ingressHosts)) }}
{{- end }}
{{- /* The certificate covers every host the rules match, or global.tls.hostname
     alone when they match any host. */}}
{{- $tlsHosts := $ingressHosts | default (compact (list $hostname)) }}
{{- if .Values.ingress.enabled }}
apiVersion: "networking.k8s.io/v1"
kind: "Ingress"
metadata:
  name: {{ include "runner.fullname" . }}
  labels: {{- include "runner.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares:
      {{ .Release.Namespace }}-{{ include "runner.fullname" . }}-strip-prefix@kubernetescrd
    {{- if $tlsEnabled }}
      ,{{ .Release.Namespace }}-{{ include "runner.fullname" . }}-https-redirect@kubernetescrd
    cert-manager.io/cluster-issuer: "letsencrypt-{{ .Values.global.tls.environment }}"
    {{- end }}
spec:
  {{- with .Values.ingress.className | default .Values.global.ingress.className }}
  ingressClassName: {{ tpl . $ }}
  {{- end }}
  rules:
    {{- range $host := $ingressHosts | default (list "") }}
    {{- if $host }}
    - host: {{ $host }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          - backend:
              service:
                name: {{ include "runner.fullname" $ }}
                port:
                  name: "api"
            path: '/{{ $.Values.baseApiUrl }}'
            pathType: "Prefix"
          - backend:
              service:
                name: {{ include "runner.fullname" $ }}
                port:
                  name: "api"
            path: '/api/{{ $.Values.baseApiUrl }}'
            pathType: "Prefix"
          - backend:
              service:
                name: {{ include "runner.fullname" $ }}
                port:
                  name: "user-api"
            path: '/user-api'
            pathType: "Prefix"
    {{- end }}
  {{- if $tlsEnabled }}
  {{- if not $tlsHosts }}
  {{- fail "ERROR: global.tls.hostname or global.ingress.hosts is required when TLS is enabled" }}
  {{- end }}
  tls:
    - hosts:
        {{- range $tlsHosts }}
        - {{ . }}
        {{- end }}
      secretName: {{ .Values.global.tls.existingCertificatSecret | default (printf "ryax-cert-%s" .Values.global.tls.environment) }}
  {{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "runner.fullname" . }}-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - '/{{ .Values.baseApiUrl }}'
      - '/api/{{ .Values.baseApiUrl }}'
      - '/user-api'
{{- if $tlsEnabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "runner.fullname" . }}-https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}
{{- end }}
