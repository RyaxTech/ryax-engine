global:
  # -- Add nodeSelector injected as-is (https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector)
  # @section -- Global
  # Example:
  #   myenv: prod
  nodeSelector: {}
  # -- Global container image registry
  # @section -- Global
  imageRegistry:
  # -- Global container registry secret names as an array
  # Example:
  #   - name: myPullSercret
  # @section -- Global
  imagePullSecrets: []
  # --	Global default StorageClass for Persistent Volume(s)
  # @section -- Global
  defaultStorageClass:

  monitoring:
    # -- Enables service monitoring
    # @section -- Global
    enabled: false

  ryax:
    # -- Global Ryax log level to use, ignored if empty
    # @section -- Ryax
    logLevel:
    # -- The namespace to put all Ryax users actions
    # @section -- Ryax
    userNamespace: ryaxns-execs
  # -- Credential secrets the chart generates itself (database, broker, JWT,
  # encryption keys, registry htpasswd and TLS). Set to false to supply every one
  # of them yourself -- sealed-secrets, external-secrets, or a plain kubectl
  # create -- under the names listed in the values below. This is what a GitOps
  # deployment wants: the generated values come from `lookup()`, which returns
  # nothing when the chart is rendered without a cluster connection (`helm
  # template`, ArgoCD's and Flux's repo servers), so every render would otherwise
  # mint fresh passwords and roll them out to running pods.
  # @section -- Global
  secrets:
    create: true
  # -- Tolerations injected as-is into every Ryax pod
  # (https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/).
  # Required to run Ryax on tainted nodes; override per subchart with its own
  # `tolerations`.
  # Example:
  #   - key: mycompany/mesh
  #     operator: Exists
  #     effect: NoSchedule
  # @section -- Global
  tolerations: []
  # -- Affinity injected as-is into every Ryax pod. Override per subchart with its
  # own `affinity`.
  # @section -- Global
  affinity: {}


# -- container image name and version
image:
  tag: "26.7.0"
  registry: docker.io/ryaxtech
  repository: action-builder
  digest: ""
  ## Specify a imagePullPolicy
  ## ref: https://kubernetes.io/docs/concepts/containers/images/#pre-pulled-images
  ##
  pullPolicy: IfNotPresent

priorityClass: # "microservices"

# -- Git reference to use for the Ryax Wrappers repository that is pulled from https://gitlab.com/ryax-tech/ryax/ryax-action-wrappers.git
# Leave empty to use the wrapper pinned in the Builder
# @section -- Ryax Settings
ryaxWrappersGitReference:

# -- log level of the service
logLevel:

internalRegistry: "ryax-registry:5000"
# -- Name of the secret that contains credentials to access the registry hosting Ryax actions.
# Leave empty to use public access registry
# Secret must be of type: kubernetes.io/dockerconfigjson
actionRegistrySecret:
brokerSecret: "ryax-broker-secret"

# -- Nix store can be put in a persistent storage or a ephemeral one
nix:
  # -- The size of the store
  storeSize: 50Gi

# -- persistence is use for the Nix store
persistence:
  enabled: true
  # -- leave empty to use the default one
  storageClass:

# Experimental gRPC API, disabled by default
grpcAPI:
  enabled: false

# -- Recommended resource requirement really depends on what you are building
# Because this service is building container it might have to compile large software,
# so be aware that in some case it would require large amount of memory and some CPU to speed up the build.
# @section -- Resource Settings
resources:
  requests:
    memory: "4Gi"
    cpu: "2"
  limits:
    memory: "4Gi"
    cpu: "2"

# -- Add affinity injected as-is (https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity)
# -- Tolerations injected as-is, overriding `global.tolerations` when set
# (https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/).
tolerations: []
# -- nodeSelector injected as-is, overriding `global.nodeSelector` when set
# (https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector)
nodeSelector: {}
affinity: {}
#   nodeAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#       nodeSelectorTerms:
#       - matchExpressions:
#         - key: topology.kubernetes.io/zone
#           operator: In
#           values:
#           - antarctica-east1
#           - antarctica-west1
# extraEnv:
#   - name: FOO
#     value: bar
extraEnv: []
