{{- $tlsEnabled := .Values.global.tls.enabled }}
{{- $hostname := .Values.global.tls.hostname }}
{{- /* Hosts the rules match; empty matches any host (roadmap#1448). */}}
{{- $ingressHosts := .Values.global.ingress.hosts | default list }}
{{- if and $ingressHosts $hostname (not (has $hostname $ingressHosts)) }}
{{- fail (printf "global.tls.hostname (%s) must be one of global.ingress.hosts (%s)" $hostname (join ", " $ingressHosts)) }}
{{- end }}
{{- /* The certificate covers every host the rules match, or global.tls.hostname
     alone when they match any host. */}}
{{- $tlsHosts := $ingressHosts | default (compact (list $hostname)) }}
{{- if .Values.ingress.enabled }}
apiVersion: "networking.k8s.io/v1"
kind: "Ingress"
metadata:
  name: {{ include "front.fullname" . }}
  labels: {{- include "front.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares:
      {{ .Release.Namespace }}-{{ include "front.fullname" . }}-strip-prefix@kubernetescrd
    {{- if $tlsEnabled }}
      ,{{ .Release.Namespace }}-{{ include "front.fullname" . }}-https-redirect@kubernetescrd
      {{- if gt (int .Values.ingress.hstsSeconds) 0 }}
      ,{{ .Release.Namespace }}-{{ include "front.fullname" . }}-hsts@kubernetescrd
      {{- end }}
    cert-manager.io/cluster-issuer: "letsencrypt-{{ .Values.global.tls.environment }}"
    {{- end }}
spec:
  {{- with .Values.ingress.className | default .Values.global.ingress.className }}
  ingressClassName: {{ tpl . $ }}
  {{- end }}
  rules:
    {{- range $host := $ingressHosts | default (list "") }}
    {{- if $host }}
    - host: {{ $host }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          - backend:
              service:
                name: {{ include "front.fullname" $ }}
                port:
                  name: http
            path: /app
            pathType: Prefix
          - backend:
              service:
                name: {{ include "front.fullname" $ }}
                port:
                  name: http
            path: /
            pathType: Exact
    {{- end }}
  {{- if $tlsEnabled }}
  {{- if not $tlsHosts }}
  {{- fail "ERROR: global.tls.hostname or global.ingress.hosts is required when TLS is enabled" }}
  {{- end }}
  tls:
    - hosts:
        {{- range $tlsHosts }}
        - {{ . }}
        {{- end }}
      secretName: {{ .Values.global.tls.existingCertificatSecret | default (printf "ryax-cert-%s" .Values.global.tls.environment) }}
  {{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "front.fullname" . }}-strip-prefix
spec:
  stripPrefix:
    prefixes:
      - '/app'
{{- if $tlsEnabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "front.fullname" . }}-https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- if gt (int .Values.ingress.hstsSeconds) 0 }}
---
# HSTS is the one security header the front image does not set itself. nginx in
# that image serves plain HTTP behind this ingress and `global.tls.enabled`
# defaults to false, so a header baked into the image would pin browsers to an
# https:// origin that a non-TLS deployment never answers. Here it is emitted only
# where TLS actually terminates.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "front.fullname" . }}-hsts
spec:
  headers:
    stsSeconds: {{ int .Values.ingress.hstsSeconds }}
    stsIncludeSubdomains: {{ .Values.ingress.hstsIncludeSubdomains }}
    stsPreload: false
    forceSTSHeader: true
{{- end }}
{{- end }}
{{- end }}
