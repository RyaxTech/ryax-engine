{{- if and .Values.global.secrets.create .Values.adminSecretCreate }}
# Credentials of the admin account the service seeds on its very first start.
# `lookup` first so an upgrade keeps the password the operator was given, rather
# than rotating a credential that is already written down somewhere.
apiVersion: "v1"
kind: "Secret"
metadata:
  name: {{ .Values.adminSecret }}
  labels: {{ include "authorization.labels" . | nindent 4 }}
type: "Opaque"
stringData:
  {{- $secretData := get (lookup "v1" "Secret" .Release.Namespace .Values.adminSecret) "data" | default dict }}
  admin-user: {{ get $secretData "admin-user" | b64dec | default .Values.adminUsername | quote }}
  # randAlphaNum, not randAscii: the operator copies this value out of kubectl by
  # hand, and quoted is how it survives being pasted into a shell.
  admin-password: {{ get $secretData "admin-password" | b64dec | default .Values.adminPassword | default (randAlphaNum 16) | quote }}
{{- end }}
