suite: Admin credentials secret
# The chart creates the admin credentials unless global.secrets.create or
# adminSecretCreate is off. It reads the live secret with lookup() first, so an
# upgrade keeps the password the operator was given; without one it takes
# adminPassword, then a random one.
templates:
  - templates/secrets.yaml
release:
  namespace: ryaxns
tests:
  - it: is not created with global.secrets.create off
    set:
      global.secrets.create: false
    asserts:
      - hasDocuments:
          count: 0
  - it: is not created with adminSecretCreate off
    set:
      adminSecretCreate: false
    asserts:
      - hasDocuments:
          count: 0

  - it: generates a password for the default user
    asserts:
      - equal:
          path: metadata.name
          value: ryax-admin-credentials
      - equal:
          path: stringData.admin-user
          value: admin
      - matchRegex:
          path: stringData.admin-password
          pattern: ^[A-Za-z0-9]{16}$
  - it: takes adminUsername and adminPassword
    set:
      adminUsername: root
      adminPassword: given
    asserts:
      - equal:
          path: stringData.admin-user
          value: root
      - equal:
          path: stringData.admin-password
          value: given
  - it: keeps the live credentials over adminUsername and adminPassword
    set:
      adminUsername: root
      adminPassword: given
    kubernetesProvider:
      scheme: &secrets
        v1/Secret:
          gvr: {version: v1, resource: secrets}
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata: {name: ryax-admin-credentials, namespace: ryaxns}
          data:
            admin-user: Ym9i            # bob
            admin-password: czNjcjN0    # s3cr3t
    asserts:
      - equal:
          path: stringData.admin-user
          value: bob
      - equal:
          path: stringData.admin-password
          value: s3cr3t
  - it: ignores a secret of the same name in another namespace
    kubernetesProvider:
      scheme: *secrets
      objects:
        - apiVersion: v1
          kind: Secret
          metadata: {name: ryax-admin-credentials, namespace: other}
          data:
            admin-password: czNjcjN0    # s3cr3t
    asserts:
      - notEqual:
          path: stringData.admin-password
          value: s3cr3t
