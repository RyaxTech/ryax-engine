apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-scale-down
  labels: {{- include "studio.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: "rbac.authorization.k8s.io/v1"
kind: Role
metadata:
  name: {{ .Release.Name }}-scale-down
  labels: {{- include "studio.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [ "apps" ]
    resources:
      - deployments
      - deployments/scale
    resourceNames:
      - {{ include "studio.fullname" . }}
    verbs:
      - get
      - update
      - patch
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: "{{ .Release.Name }}-scale-down"
  labels: {{- include "studio.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: "{{ .Release.Name }}-scale-down"
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: "{{ .Release.Name }}-scale-down"
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-scale-down"
  labels: {{- include "studio.labels" . | nindent 4 }}
  annotations:
    # This is what defines this resource as a hook. Without this line, the
    # job is considered part of the release.
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: "{{ .Release.Name }}-scale-down"
      labels: {{- include "studio.labels" . | nindent 8 }}
    spec:
      serviceAccountName: "{{ .Release.Name }}-scale-down"
      restartPolicy: Never
      {{- with .Values.tolerations | default .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector | default .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity | default .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: scale-down-before-migration-job
          image: {{ .Values.updaterImage }}
          env:
            - name: RYAX_RELEASE_INSTALLED
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.releaseMarker }}
                  key: "installed"
                  optional: true
          command:
            - /bin/bash
            - -c
            - |
              set -e

              # No marker ConfigMap means no previous release in this namespace,
              # so there is nothing to migrate yet: the normal Sync-phase resources
              # are about to create and initialise the database. Exiting 0 here is
              # what lets a GitOps engine -- which cannot tell an install from an
              # upgrade and so runs this hook on the very first sync -- get past this
              # phase instead of deadlocking on it.
              if [ -z "${RYAX_RELEASE_INSTALLED:-}" ]; then
                echo "No previous Ryax release in this namespace: no deployment to scale down, skipping."
                exit 0
              fi

              set -x
              set -u

              kubectl version
              
              echo Scale down {{ include "studio.fullname" . }} deployment to allow database migration
              kubectl scale deployment --namespace={{ .Release.Namespace }} --replicas=0 {{ include "studio.fullname" . }} || echo 'Fail to downscale ! Assuming no previews version deployed. Continue...'
              echo Done!
---
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ include "studio.fullname" . }}-db-migration"
  labels: {{- include "studio.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: "{{ include "studio.fullname" . }}-db-migration"
      labels: {{- include "studio.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 1200
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations | default .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector | default .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity | default .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - emptyDir:
          name: "tmp-dir"
      containers:
        - name: {{ include "studio.fullname" . | printf "%s-database-migration" }}
          image: {{ include "studio.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: "tmp-dir"
              mountPath: "/tmp"
          command:
            - /bin/bash
            - -c
            - |
              set -e

              # No marker ConfigMap means no previous release in this namespace,
              # so there is nothing to migrate yet: the normal Sync-phase resources
              # are about to create and initialise the database. Exiting 0 here is
              # what lets a GitOps engine -- which cannot tell an install from an
              # upgrade and so runs this hook on the very first sync -- get past this
              # phase instead of deadlocking on it.
              if [ -z "${RYAX_RELEASE_INSTALLED:-}" ]; then
                echo "No previous Ryax release in this namespace: nothing to migrate, skipping."
                exit 0
              fi

              exec ryax-studio-update-db
          env:
            - name: RYAX_RELEASE_INSTALLED
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.releaseMarker }}
                  key: "installed"
                  optional: true
            - name: RYAX_DATASTORE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.datastoreSecret }}
                  key: "datastore-studio"
                  optional: true
            - name: "RYAX_PASSWORD_ENCRYPTION_KEY"
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.passwordEncryptionKeySecret }}
                  key: encryption-key
                  optional: true
            - name: RYAX_LOG_LEVEL
              value: {{ .Values.logLevel | default .Values.global.ryax.logLevel | default "warning" }}
