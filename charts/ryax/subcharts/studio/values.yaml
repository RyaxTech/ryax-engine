global:
  # -- Add nodeSelector injected as-is (https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector)
  # @section -- Global
  nodeSelector: {}
  # -- Global container image registry
  # @section -- Global
  imageRegistry:
  # -- Global container registry secret names as an array
  # Example:
  #   - name: myPullSercret
  # @section -- Global
  imagePullSecrets: []
  # --	Global default StorageClass for Persistent Volume(s)
  # @section -- Global
  # defaultStorageClass:

  tls:
    # -- Enables TLS for ingress
    # @section -- Global
    enabled: false
    # -- The Ryax cluster name, must be a valid DNS
    # @section -- Global
    hostname:
    # -- In production to get a valid certificat from let's encrypt, otherwise
    # use the staging Let's encrypt cluster to avoid rate limit
    # Should be: development or production
    # @section -- Global
    environment: development
    # -- for self hosted instance with intenal TLS certificate
    # @section -- Global
    existingCertificatSecret:

  ryax:
    logLevel:
  # -- Credential secrets the chart generates itself (database, broker, JWT,
  # encryption keys, registry htpasswd and TLS). Set to false to supply every one
  # of them yourself -- sealed-secrets, external-secrets, or a plain kubectl
  # create -- under the names listed in the values below. This is what a GitOps
  # deployment wants: the generated values come from `lookup()`, which returns
  # nothing when the chart is rendered without a cluster connection (`helm
  # template`, ArgoCD's and Flux's repo servers), so every render would otherwise
  # mint fresh passwords and roll them out to running pods.
  # @section -- Global
  secrets:
    create: true
  # -- Tolerations injected as-is into every Ryax pod
  # (https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/).
  # Required to run Ryax on tainted nodes; override per subchart with its own
  # `tolerations`.
  # Example:
  #   - key: mycompany/mesh
  #     operator: Exists
  #     effect: NoSchedule
  # @section -- Global
  tolerations: []
  # -- Affinity injected as-is into every Ryax pod. Override per subchart with its
  # own `affinity`.
  # @section -- Global
  affinity: {}

# -- container image name and version
image:
  tag: "26.7.0"
  registry: docker.io/ryaxtech
  repository: studio
  digest: ""
  ## Specify a imagePullPolicy
  ## ref: https://kubernetes.io/docs/concepts/containers/images/#pre-pulled-images
  ##
  pullPolicy: IfNotPresent

# -- Image used by the updater job pod
updaterImage: docker.io/bitnamilegacy/kubectl:1.33

# -- log level of the service
logLevel:

# -- Deployment prority class
priorityClass:

# -- Max upload size in Bytes for the API. Change this to enable larger file to be used as static or inputs, of project variables.
# Default to 1GB
# @section -- Ryax Settings
apiMaxUploadSizeInBytes: "1073741824"

apiPort: 8080
# -- Name of the ConfigMap that marks the release as installed. The
# database-migration hooks read it and skip themselves when it is absent, so a
# first sync cannot deadlock on a database that does not exist yet. Created by
# the common-resources subchart.
releaseMarker: "ryax-release-marker"
datastoreSecret: "ryax-datastore-secret"
# -- Name of the secret holding the Fernet key used to encrypt PASSWORD values at rest
passwordEncryptionKeySecret: studio-password-encryption-key
# -- Create the secret above. Set to false to provide it yourself; it must then
# carry the key(s): encryption-key.
passwordEncryptionKeySecretCreate: true
# -- Fernet key used to encrypt PASSWORD values at rest. Leave empty to let Helm
# generate one (preserved across upgrades), or set it (see generate-secrets.py).
fernetEncryptionKey:
jwtSecret: "api-jwt-secret-key"
brokerSecret: "ryax-broker-secret"
filestoreSecret: "ryax-minio-secret"
filestoreName: "ryax-filestore"
authorizationUrl: "ryax-authorization:8080"
#
# -- resources for the pod
# Example:
#  requests:
#    memory: "200Mi"
#    cpu: "100m"
#  limits:
#    memory: "200Mi"
resources: {}

# -- Add extra environment variables
# Example:
#   name: TEST
#   value: TOTO
extraEnv: {}
#
# -- Add affinity injected as-is (https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity)
# -- Tolerations injected as-is, overriding `global.tolerations` when set
# (https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/).
tolerations: []
# -- nodeSelector injected as-is, overriding `global.nodeSelector` when set
# (https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector)
nodeSelector: {}
affinity: {}
#   nodeAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#       nodeSelectorTerms:
#       - matchExpressions:
#         - key: topology.kubernetes.io/zone
#           operator: In
#           values:
#           - antarctica-east1
#           - antarctica-west1

ingress:
  # -- Render an Ingress for this service. Turn it off when routing is handled
  # outside the chart -- Gateway API, a service mesh, an external load balancer.
  # With no controller to fill in `.status.loadBalancer`, a GitOps engine that
  # health-checks Ingresses reports them Progressing forever and parks the sync.
  enabled: true
  # -- Value for `spec.ingressClassName`. Left empty, the Ingress is claimed by
  # whichever IngressClass is marked default in the cluster -- which is a
  # cluster-wide setting, not this chart's to rely on.
  className: ""
