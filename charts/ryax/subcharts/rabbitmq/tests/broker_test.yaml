suite: The RabbitmqCluster that runs the Ryax broker
# The services reach the broker at ryax-broker:5672 with the credentials of
# ryax-broker-secret. The operator names the AMQP Service after the
# RabbitmqCluster, and seeds the default user from what the override below
# feeds RabbitMQ, so both are asserted here.
templates:
  - templates/rabbitmqcluster.yaml
release:
  name: ryax
  namespace: ryaxns
tests:
  # Every other test picks its document by template, which a render error turns
  # into "no document": the assertions would then fail for the wrong reason,
  # or, behind a skip, pass without checking anything.
  - it: renders
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 1
      - isKind:
          of: RabbitmqCluster

  - it: is named after the broker host of the services
    asserts:
      - equal:
          path: metadata.name
          value: ryax-broker
      - equal:
          path: spec.service.type
          value: ClusterIP
      - equal:
          path: spec.replicas
          value: 1

  - it: runs the official RabbitMQ image
    asserts:
      - equal:
          path: spec.image
          value: docker.io/rabbitmq:4.3.6-management
  - it: refuses a Bitnami image left over from an older values file
    set:
      image.repository: docker.io/bitnamilegacy/rabbitmq
    asserts:
      - failedTemplate:
          errorPattern: "the broker now runs on the official RabbitMQ image"

  - it: seeds the default user from the broker secret
    asserts:
      - equal:
          path: spec.rabbitmq.additionalConfig
          value: |
            default_user = $(RYAX_BROKER_USER)
            default_pass = $(RYAX_BROKER_PASSWORD)
      - equal:
          path: spec.override.statefulSet.spec.template.spec.containers[0].name
          value: rabbitmq
      - contains:
          path: spec.override.statefulSet.spec.template.spec.containers[0].env
          content:
            name: RYAX_BROKER_USER
            valueFrom:
              secretKeyRef: {name: ryax-broker-secret, key: broker-user}
      - contains:
          path: spec.override.statefulSet.spec.template.spec.containers[0].env
          content:
            name: RYAX_BROKER_PASSWORD
            valueFrom:
              secretKeyRef: {name: ryax-broker-secret, key: rabbitmq-password}
  - it: appends extra configuration after the default user
    set:
      additionalConfig: |
        log.console.level = debug
        consumer_timeout = 3600000
    asserts:
      - equal:
          path: spec.rabbitmq.additionalConfig
          value: |
            default_user = $(RYAX_BROKER_USER)
            default_pass = $(RYAX_BROKER_PASSWORD)
            log.console.level = debug
            consumer_timeout = 3600000

  - it: keeps its state on a 1Gi volume of the default class
    asserts:
      - equal:
          path: spec.persistence.storage
          value: 1Gi
      - notExists:
          path: spec.persistence.storageClassName
  - it: takes the global default storage class
    set:
      global.defaultStorageClass: local-path
    asserts:
      - equal:
          path: spec.persistence.storageClassName
          value: local-path
  - it: lets its own storage class replace the global one
    set:
      global.defaultStorageClass: local-path
      persistence.storageClass: fast
      persistence.size: 5Gi
    asserts:
      - equal:
          path: spec.persistence.storageClassName
          value: fast
      - equal:
          path: spec.persistence.storage
          value: 5Gi
  - it: keeps its state in an emptyDir with persistence off
    set:
      persistence.enabled: false
    asserts:
      - equal:
          path: spec.persistence.storage
          value: "0"
      - notExists:
          path: spec.persistence.storageClassName

  - it: sets the requested resources rather than the operator's 2 CPU / 2Gi
    asserts:
      - equal:
          path: spec.resources
          value:
            requests: {cpu: 100m, memory: 500Mi}
            limits: {memory: 1000Mi}
  - it: starts at once and does not wait a week to stop
    asserts:
      - equal:
          path: spec.delayStartSeconds
          value: 0
      - equal:
          path: spec.terminationGracePeriodSeconds
          value: 60

  # Upgrades: Helm never applies crds/ on an upgrade.
  - it: stops an upgrade on a cluster without the CRD, saying how to apply it
    release:
      upgrade: true
    chart:
      version: 26.10.0
    asserts:
      - failedTemplate:
          errorPattern: "kubectl apply --server-side -f https://gitlab.com/ryax-tech/ryax/ryax-engine/-/raw/26.10.0/charts/ryax/subcharts/rabbitmq/crds/rabbitmqclusters.rabbitmq.com.yaml"
  - it: upgrades once the CRD is there
    release:
      upgrade: true
    capabilities:
      apiVersions:
        - rabbitmq.com/v1beta1/RabbitmqCluster
    asserts:
      - notFailedTemplate: {}
      - isKind:
          of: RabbitmqCluster
