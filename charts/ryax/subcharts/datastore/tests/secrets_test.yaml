suite: Datastore credentials secret
# One password for the main database and one per entry of `databases`, each
# also spelled out in a connection URL. The chart reads the live secret with
# lookup() first, so an upgrade keeps every password the databases were
# initialised with; a database added since gets a new one.
templates:
  - templates/secrets.yaml
release:
  name: ryax
  namespace: ryaxns
set:
  databases: [runner, studio]
tests:
  - it: is not created with global.secrets.create off
    set:
      global.secrets.create: false
    asserts:
      - hasDocuments:
          count: 0
  - it: is not created with datastoreSecretCreate off
    set:
      datastoreSecretCreate: false
    asserts:
      - hasDocuments:
          count: 0

  - it: generates a password per database
    asserts:
      - equal:
          path: metadata.name
          value: ryax-datastore-secret
      - matchRegex:
          path: stringData.datastore-pass
          pattern: ^[A-Za-z0-9]{12}$
      - matchRegex:
          path: stringData.datastore
          pattern: ^postgresql://ryax:[A-Za-z0-9]{12}@ryax-datastore/ryaxdb$
      - equal:
          path: stringData.datastore-runner-user
          value: runner
      - equal:
          path: stringData.datastore-runner-db
          value: runner
      - matchRegex:
          path: stringData.datastore-runner
          pattern: ^postgresql://runner:[A-Za-z0-9]{12}@ryax-datastore/runner$
      - matchRegex:
          path: stringData.datastore-studio
          pattern: ^postgresql://studio:[A-Za-z0-9]{12}@ryax-datastore/studio$
  - it: keeps the live passwords, and generates one for a new database
    kubernetesProvider:
      scheme:
        v1/Secret:
          gvr: {version: v1, resource: secrets}
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata: {name: ryax-datastore-secret, namespace: ryaxns}
          data:
            datastore-pass: cDA=           # p0
            datastore-runner-pass: cDE=    # p1
    asserts:
      - equal:
          path: stringData.datastore-pass
          value: p0
      - equal:
          path: stringData.datastore
          value: postgresql://ryax:p0@ryax-datastore/ryaxdb
      - equal:
          path: stringData.datastore-runner-pass
          value: p1
      - equal:
          path: stringData.datastore-runner
          value: postgresql://runner:p1@ryax-datastore/runner
      - matchRegex:
          path: stringData.datastore-studio-pass
          pattern: ^[A-Za-z0-9]{12}$
  - it: lists every database for the exporter with monitoring on
    asserts:
      - matchRegex:
          path: stringData.all-databases
          pattern: ^postgresql://ryax:[A-Za-z0-9]{12}@ryax-datastore/ryaxdb\?sslmode=disable$
  - it: leaves the exporter's URL out with monitoring off
    set:
      global.monitoring.enabled: false
    asserts:
      - notExists:
          path: stringData.all-databases
