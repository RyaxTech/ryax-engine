global:
  # -- Add nodeSelector injected as-is (https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector)
  # @section -- Global
  nodeSelector: {}
  # -- Global container registry secret names as an array
  # Example:
  #   - name: myPullSercret
  # @section -- Global
  imagePullSecrets: []
  
  monitoring:
    # -- Enables service monitoring
    # @section -- Global
    enabled: true
  # -- Credential secrets the chart generates itself (database, broker, JWT,
  # encryption keys, registry htpasswd and TLS). Set to false to supply every one
  # of them yourself -- sealed-secrets, external-secrets, or a plain kubectl
  # create -- under the names listed in the values below. This is what a GitOps
  # deployment wants: the generated values come from `lookup()`, which returns
  # nothing when the chart is rendered without a cluster connection (`helm
  # template`, ArgoCD's and Flux's repo servers), so every render would otherwise
  # mint fresh passwords and roll them out to running pods.
  # @section -- Global
  secrets:
    create: true
  # -- Tolerations injected as-is into every Ryax pod
  # (https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/).
  # Required to run Ryax on tainted nodes; override per subchart with its own
  # `tolerations`.
  # Example:
  #   - key: mycompany/mesh
  #     operator: Exists
  #     effect: NoSchedule
  # @section -- Global
  tolerations: []
  # -- Affinity injected as-is into every Ryax pod. Override per subchart with its
  # own `affinity`.
  # @section -- Global
  affinity: {}

priorityClass: # backbone
# -- Tolerations injected as-is, overriding `global.tolerations` when set
# (https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/).
tolerations: []
# -- nodeSelector injected as-is, overriding `global.nodeSelector` when set
# (https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector)
nodeSelector: {}
affinity: {}

image: "docker.io/postgres:18"
exporterImage: "quay.io/prometheuscommunity/postgres-exporter:v0.18.1"

servicePort: 5432
# -- Name of the ConfigMap that marks the release as installed. The
# database-migration hooks read it and skip themselves when it is absent, so a
# first sync cannot deadlock on a database that does not exist yet. Created by
# the common-resources subchart.
releaseMarker: "ryax-release-marker"
datastoreSecret: "ryax-datastore-secret"
# -- Create the secret above. Set to false to provide it yourself; it must then
# carry the key(s): datastore, datastore-db, datastore-user, datastore-pass and datastore-<db>{,-db,-user,-pass} for every entry of `databases`.
datastoreSecretCreate: true
databases:
  - repository
  - studio
  - authorization
  - runner
pvcName: "ryax-datastore-pvc-0"
pvcSize: "2Gi"
storageClass:
datastoreUser: "ryax"
datastoreDB: "ryaxdb"
resources:
  requests:
    memory: "500Mi"
    cpu: "100m"
  limits:
    memory: "1000Mi"
exporterResources:
  requests:
    memory: "200Mi"
    cpu: "100m"
  limits:
    memory: "200Mi"
    cpu: "200m"
