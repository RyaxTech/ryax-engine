suite: Shared credentials secrets
# The broker, filestore, JWT and Grafana credentials. Each is created unless
# global.secrets.create or its own *SecretCreate is off, and reads the live
# secret with lookup() first, so an upgrade keeps the credentials the broker,
# the filestore and the issued tokens already use.
templates:
  - templates/broker-secrets.yaml
  - templates/filestore-secret.yaml
  - templates/secrets.yaml
release:
  name: ryax
  namespace: ryaxns
tests:
  - it: creates none with global.secrets.create off
    set:
      global.secrets.create: false
    asserts:
      - hasDocuments:
          count: 0

  # Broker: the password and its URL in the release and the user namespaces,
  # plus the Erlang cookie, all gated by brokerSecretCreate.
  - template: templates/broker-secrets.yaml
    it: puts the broker credentials in the release and the user namespaces
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.namespace
          value: ryaxns
        documentIndex: 0
      - equal:
          path: metadata.namespace
          value: ryaxns-execs
        documentIndex: 1
      - equal:
          path: metadata.name
          value: ryax-broker-cookie
        documentIndex: 2
  - template: templates/broker-secrets.yaml
    it: generates a broker password and its URL
    documentIndex: 1
    asserts:
      - matchRegex:
          path: stringData.rabbitmq-password
          pattern: ^[A-Za-z0-9]{12}$
      - matchRegex:
          path: stringData.broker
          pattern: ^ampq://ryaxmq:[A-Za-z0-9]{12}@ryax-broker\.ryaxns:5672/$
  - template: templates/broker-secrets.yaml
    it: generates an Erlang cookie
    documentIndex: 2
    asserts:
      - matchRegex:
          path: data.rabbitmq-erlang-cookie
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{30}$
  - template: templates/broker-secrets.yaml
    it: carries the live password of the release namespace into both namespaces
    kubernetesProvider:
      scheme: &secrets
        v1/Secret:
          gvr: {version: v1, resource: secrets}
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata: {name: ryax-broker-secret, namespace: ryaxns}
          data:
            rabbitmq-password: cDA=    # p0
        # A stale copy in the user namespace is overwritten, not kept.
        - apiVersion: v1
          kind: Secret
          metadata: {name: ryax-broker-secret, namespace: ryaxns-execs}
          data:
            rabbitmq-password: cDE=    # p1
        - apiVersion: v1
          kind: Secret
          metadata: {name: ryax-broker-cookie, namespace: ryaxns}
          data:
            rabbitmq-erlang-cookie: Y29va2llLTAxMjM=
    asserts:
      - equal:
          path: stringData.rabbitmq-password
          value: p0
        documentIndex: 0
      - equal:
          path: stringData.broker
          value: ampq://ryaxmq:p0@ryax-broker.ryaxns:5672/
        documentIndex: 0
      - equal:
          path: stringData.rabbitmq-password
          value: p0
        documentIndex: 1
      - equal:
          path: stringData.broker
          value: ampq://ryaxmq:p0@ryax-broker.ryaxns:5672/
        documentIndex: 1
      - equal:
          path: data.rabbitmq-erlang-cookie
          value: Y29va2llLTAxMjM=
        documentIndex: 2
  - template: templates/broker-secrets.yaml
    it: creates neither the broker secrets nor the cookie with brokerSecretCreate off
    set:
      brokerSecretCreate: false
    asserts:
      - hasDocuments:
          count: 0

  # Filestore: one password, as the S3 secret key and the root password.
  - template: templates/filestore-secret.yaml
    it: generates the filestore password
    asserts:
      - equal:
          path: stringData.filestore
          value: ryax-minio.ryaxns:9000
      - matchRegex:
          path: stringData.root-password
          pattern: ^[A-Za-z0-9]{12}$
  - template: templates/filestore-secret.yaml
    it: keeps the live filestore password as both the secret key and the root password
    kubernetesProvider:
      scheme: *secrets
      objects:
        - apiVersion: v1
          kind: Secret
          metadata: {name: ryax-minio-secret, namespace: ryaxns}
          data:
            root-password: ZnMtcGFzcw==    # fs-pass
    asserts:
      - equal:
          path: stringData.root-password
          value: fs-pass
      - equal:
          path: stringData.filestore-secret
          value: fs-pass
  - template: templates/filestore-secret.yaml
    it: is not created with filestoreSecretCreate off
    set:
      filestoreSecretCreate: false
    asserts:
      - hasDocuments:
          count: 0

  # JWT signing key, and the Grafana credentials when monitoring is on.
  - template: templates/secrets.yaml
    it: generates the JWT key and, with monitoring on, the Grafana password
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: api-jwt-secret-key
        documentIndex: 0
      - matchRegex:
          path: data.jwt-secret-key
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{64}$
        documentIndex: 0
      - equal:
          path: metadata.name
          value: grafana-credentials
        documentIndex: 1
      - matchRegex:
          path: stringData.admin-password
          pattern: ^[A-Za-z0-9]{12}$
        documentIndex: 1
  - template: templates/secrets.yaml
    it: keeps the live JWT key and Grafana password
    kubernetesProvider:
      scheme: *secrets
      objects:
        - apiVersion: v1
          kind: Secret
          metadata: {name: api-jwt-secret-key, namespace: ryaxns}
          data:
            jwt-secret-key: and0LTAxMjM=    # jwt-0123
        - apiVersion: v1
          kind: Secret
          metadata: {name: grafana-credentials, namespace: ryaxns}
          data:
            admin-password: Z2YtcGFzcw==    # gf-pass
    asserts:
      - equal:
          path: data.jwt-secret-key
          value: and0LTAxMjM=
        documentIndex: 0
      - equal:
          path: stringData.admin-password
          value: gf-pass
        documentIndex: 1
  - template: templates/secrets.yaml
    it: creates no Grafana credentials with monitoring off
    set:
      global.monitoring.enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: api-jwt-secret-key
  - template: templates/secrets.yaml
    it: creates neither with jwtSecretCreate and grafanaSecretCreate off
    set:
      jwtSecretCreate: false
      grafanaSecretCreate: false
    asserts:
      - hasDocuments:
          count: 0
