suite: Database credentials secret
# The credentials of the bundled PostgreSQL, created unless postgresql.enabled,
# global.secrets.create or postgresql.auth.createSecret is off. The chart reads
# the live secret with lookup() first, so an upgrade keeps the passwords the
# database was initialised with; without one it takes postgresql.auth.password
# and postgresPassword, then random ones.
templates:
  - templates/secrets.yaml
release:
  name: ryax
  namespace: ryaxns
tests:
  - it: is not created with global.secrets.create off
    set:
      global.secrets.create: false
    asserts: &none
      - hasDocuments:
          count: 0
  - it: is not created with postgresql.auth.createSecret off
    set:
      postgresql.auth.createSecret: false
    asserts: *none
  - it: is not created without the bundled PostgreSQL
    set:
      postgresql.enabled: false
    asserts: *none

  - it: generates both passwords and the URL
    asserts:
      - equal:
          path: metadata.name
          value: ryax-db-pass
      - matchRegex:
          path: data.password
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{12}$
      - matchRegex:
          path: data.postgres-password
          decodeBase64: true
          pattern: ^[A-Za-z0-9]{12}$
      - matchRegex:
          path: data.datastore-worker-ssh-slurm
          decodeBase64: true
          pattern: ^postgresql://worker-ssh-slurm:[A-Za-z0-9]{12}@ryax-postgresql/worker-ssh-slurm$
  - it: takes postgresql.auth.password and postgresPassword
    set:
      postgresql.auth.password: pg-pass
      postgresql.auth.postgresPassword: pg-root
    asserts:
      - equal:
          path: data.password
          value: cGctcGFzcw==        # pg-pass
      - equal:
          path: data.postgres-password
          value: cGctcm9vdA==        # pg-root
  - it: keeps the live passwords over the values
    set:
      postgresql.auth.password: other
      postgresql.auth.postgresPassword: other
    kubernetesProvider:
      scheme:
        v1/Secret:
          gvr: {version: v1, resource: secrets}
          namespaced: true
      objects:
        - apiVersion: v1
          kind: Secret
          metadata: {name: ryax-db-pass, namespace: ryaxns}
          data:
            password: cGctcGFzcw==            # pg-pass
            postgres-password: cGctcm9vdA==   # pg-root
    asserts:
      - equal:
          path: data.password
          value: cGctcGFzcw==
      - equal:
          path: data.postgres-password
          value: cGctcm9vdA==
      - equal:
          path: data.datastore-worker-ssh-slurm
          decodeBase64: true
          value: postgresql://worker-ssh-slurm:pg-pass@ryax-postgresql/worker-ssh-slurm
