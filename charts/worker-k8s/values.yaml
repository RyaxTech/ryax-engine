global:
  # -- Add nodeSelector injected as-is (https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector)
  # @section -- Global
  nodeSelector: {}
  # -- Global container image registry
  # @section -- Global
  imageRegistry:
  # -- Global container registry secret names as an array
  # Example:
  #   - name: myPullSercret
  # @section -- Global
  imagePullSecrets: []
  # --	Global default StorageClass for Persistent Volume(s)
  # @section -- Global
  defaultStorageClass:

  monitoring:
    # -- Enables service monitoring
    # @section -- Global
    enabled: false
    # -- Traces collector (Tempo) endpoint Trace collection (disabled if empty)
    # @section -- Global
    otlpEndpoint: ryax-tempo:4317

  ryax:
    logLevel:
    userNamespace: ryaxns-execs
  # -- Credential secrets the chart generates itself (database, broker, JWT,
  # encryption keys, registry htpasswd and TLS). Set to false to supply every one
  # of them yourself -- sealed-secrets, external-secrets, or a plain kubectl
  # create -- under the names listed in the values below. This is what a GitOps
  # deployment wants: the generated values come from `lookup()`, which returns
  # nothing when the chart is rendered without a cluster connection (`helm
  # template`, ArgoCD's and Flux's repo servers), so every render would otherwise
  # mint fresh passwords and roll them out to running pods.
  # @section -- Global
  secrets:
    create: true
  # -- Tolerations injected as-is into every Ryax pod
  # (https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/).
  # Required to run Ryax on tainted nodes; override per subchart with its own
  # `tolerations`.
  # Example:
  #   - key: mycompany/mesh
  #     operator: Exists
  #     effect: NoSchedule
  # @section -- Global
  tolerations: []
  # -- Affinity injected as-is into every Ryax pod. Override per subchart with its
  # own `affinity`.
  # @section -- Global
  affinity: {}

# -- Name of the secret that contains credentials to access the registry hosting Ryax actions.
# Leave empty to use public access registry
# Secret must be of type: kubernetes.io/dockerconfigjson
actionRegistrySecret: ryax-registry-creds-secret

# -- Registry host to pull action images from on this site, replacing the host
# the Runner recorded in the image reference. Only needed when the kubelet
# cannot resolve that host, e.g. when the Runner points at the in-cluster
# registry Service. With the bundled registry and no Ingress, the kubelet
# reaches it through the NodePort: set this to `127.0.0.1:30012`.
# Leave empty to pull from the address the Runner provides.
internalRegistryOverride: ""

# -- Ryax Worker configuration use for the registration. See documentation for more details:
# https://docs.ryax.tech/reference/configuration.html#worker-configuration
# @section -- Ryax
config:
  site:
    spec:
      namespace: "{{ .Values.global.ryax.userNamespace }}"

# -- Gate GPU nodes so that no action pod lands on one before the NVIDIA stack
# is usable. On a scale-up the kubelet reports Ready long before the driver, the
# container toolkit, the device plugin and the MIG geometry are in place: a pod
# scheduled in that window is handed a whole GPU instead of its MIG slice, and
# nvidia-device-plugin crash-loops with "device 0 has no MIG devices configured"
# (NVIDIA/gpu-operator#2670).
#
# This is only half of the setup, and the other half is outside this chart:
#
#  1. the node pool template must carry the startup taint itself, e.g. for
#     eksctl: `taints: [{key: readiness.k8s.io/nvidia-gpu-not-ready,
#     value: pending, effect: NoSchedule}]`;
#  2. the cluster-autoscaler must be told it is a *startup* taint --
#     `--startup-taint-prefix=readiness.k8s.io/` (>= 1.36) or
#     `--startup-taint=readiness.k8s.io/nvidia-gpu-not-ready` -- otherwise it
#     reads it as permanent and never scales the pool up at all;
#  3. the GPU Operator must tolerate it, in BOTH `daemonsets.tolerations` and
#     `node-feature-discovery.worker.tolerations`. Both replace their defaults,
#     so keep the entries that are already there. Miss the second one and
#     node-feature-discovery never labels the node `nvidia.com/gpu.present`,
#     the probe below never runs, and the pool is bricked.
#
# See https://docs.ryax.tech/howto/gpu_node_pools/
# @section -- GPU Readiness
gpuReadiness:
  # -- Deploy the gate: a node-problem-detector DaemonSet that publishes the
  # `nvidia.com/GPUReady` node condition, and a controller that removes the
  # startup taint once that condition is True. Off by default -- it does nothing
  # unless the node pools carry the taint, and a tainted pool with this off is a
  # pool that never runs anything. Enable it *before* adding the taint.
  # @section -- GPU Readiness
  enabled: false

  # -- The startup taint to remove. Must match the taint on the node pool
  # template and the autoscaler's startup-taint flag.
  # @section -- GPU Readiness
  taintKey: readiness.k8s.io/nvidia-gpu-not-ready

  # -- Node condition the probe publishes and the untainter waits for.
  # @section -- GPU Readiness
  conditionType: nvidia.com/GPUReady

  # -- Nodes the gate looks at. `nvidia.com/gpu.present` is set by the GPU
  # Operator's node-feature-discovery. Set to `{}` to run the probe on every
  # node instead, which removes the dependency on node-feature-discovery being
  # able to run on a tainted node at the cost of a privileged pod everywhere.
  # @section -- GPU Readiness
  nodeSelector:
    nvidia.com/gpu.present: "true"

  # -- Tolerations for the probe DaemonSet. It exists to run on a node that is
  # by definition still tainted, so it tolerates everything. Narrow it to the
  # taints your GPU pools actually carry if you prefer.
  # @section -- GPU Readiness
  tolerations:
    - operator: Exists

  # -- Priority class for both gate workloads. Left empty it falls back to
  # `priorityClass`. Do NOT set `system-node-critical` here: the Priority
  # admission plugin refuses it outside the kube-system namespace, and the
  # DaemonSet then produces no pod at all.
  # @section -- GPU Readiness
  priorityClassName:

  # -- How often the probe runs and the untainter polls, in seconds.
  # @section -- GPU Readiness
  intervalSeconds: 10

  # -- How long the probe may take before node-problem-detector gives up on it.
  # A timed-out probe leaves the condition `Unknown`, which the untainter cannot
  # tell apart from "never ready", so do not trim this: `nvidia-smi` on a node
  # whose driver has just loaded is slow.
  # @section -- GPU Readiness
  probeTimeoutSeconds: 10

  nodeProblemDetector:
    # -- Image that runs the GPU probe and publishes the node condition. A full
    # reference on purpose: `global.imageRegistry` does not apply to it, so an
    # airgapped install overrides this key with its mirror.
    # @section -- GPU Readiness
    image: registry.k8s.io/node-problem-detector/node-problem-detector:v0.8.20
    # -- Recommended resource requirement
    # @section -- GPU Readiness
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

  untainter:
    # -- kubectl image of the loop that removes the startup taint. A full
    # reference on purpose, see nodeProblemDetector.image.
    # @section -- GPU Readiness
    image: docker.io/bitnamilegacy/kubectl:1.33
    # -- Also require `nvidia.com/mig.config.state: success` before releasing a
    # node that carries a `nvidia.com/mig.config` label. This is what the probe
    # cannot check: it sees the geometry that exists, not the one that was
    # asked for, so a node still carrying the previous pool's geometry looks
    # perfectly ready to it.
    # @section -- GPU Readiness
    requireMigConfigSuccess: true
    # -- Recommended resource requirement
    # @section -- GPU Readiness
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

# -- Resource limit and request for individual user actions if not set in the action `resources` section.
# Requires a LimitRange Kubernetes object. See for more details: https://kubernetes.io/docs/concepts/policy/limit-range/
# @section -- Ryax User Actions Settings
userActionResources:
  request:
    cpu: 0.1
    memory: 64Mi
  limit:
    memory: 64Mi

# -- Rate at which the User Action logging system is queried to get the logs in seconds.
# @section -- Ryax User Actions Settings
actionLogsQueryRate: 5

# -- Activate this to limit users' resource total usage. Highly recommended in production!
# Resource quota for the user namespace set as-is in the Kubernetes ResourceQuota:
# Example:
#   requests.cpu: "2"
#   requests.memory: 2Gi
#   limits.cpu: "16"
#   limits.memory: 32Gi
# See for more details: https://kubernetes.io/docs/concepts/policy/resource-quotas/
# @section -- Resource Settings
userNamespaceResources: {}

# -- container image name and version
image:
  tag: "26.9.0"
  registry: docker.io/ryaxtech
  repository: worker-k8s
  digest: ""
  ## Specify a imagePullPolicy
  ## ref: https://kubernetes.io/docs/concepts/containers/images/#pre-pulled-images
  ##
  pullPolicy: IfNotPresent

# -- log level of the service (override global.ryax.logLevel)
logLevel:
  
# -- Add priority class
priorityClass:

apiPort: 8083
metricsPort: 8092

brokerSecret: ryax-broker-secret

filestoreSecret: ryax-minio-secret
filestoreName: ryax-filestore

# -- Recommended resource requirement
# @section -- Resource Settings
# Example:
#   requests:
#     memory: "2Gi"
#     cpu: "1000m"
#   limits:
#     memory: "2Gi"
resources: {}

# -- Add extra environment variables
extraEnv: []

# -- Add affinity injected as-is (https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity)
# Example:
#   nodeAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#       nodeSelectorTerms:
#       - matchExpressions:
#         - key: topology.kubernetes.io/zone
#           operator: In
#           values:
#           - antarctica-east1
#           - antarctica-west1
# -- Tolerations injected as-is, overriding `global.tolerations` when set
# (https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/).
tolerations: []
# -- nodeSelector injected as-is, overriding `global.nodeSelector` when set
# (https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector)
nodeSelector: {}
affinity: {}

# -- Use this to override the default postgresql database included in the Helm
databaseURL:

# -- local postgresql database
postgresql:
  # -- Enables PostgreSQL local database
  enabled: true
  # -- The bundled PostgreSQL is an upstream Bitnami subchart: it does not read
  # `global.tolerations`, so a tainted node needs its placement set here, e.g.
  #   primary:
  #     tolerations: [...]
  #     nodeSelector: {...}
  auth:
    # -- Create the database credentials secret named by `existingSecret` below.
    # Set to false to provide it yourself; it must then carry the keys `password`,
    # `postgres-password` and `datastore-worker-k8s`.
    createSecret: true
    existingSecret: '{{ include "worker-k8s.postgresql.secret" . }}'
    database: worker_k8s
    username: worker_k8s
  image:
    repository: bitnamilegacy/postgresql
  metrics:
    image:
        repository: bitnamilegacy/postgres-exporter
  primary:
    persistence:
      size: 1Gi
  # -- No name override on purpose: the database URL follows whatever name the
  # subchart picks (see "worker-k8s.postgresql.service"). Setting nameOverride or
  # fullnameOverride here is supported and the URL follows it.

monitoring:
  # -- Enable service monitor for prometheus using ServiceMonitor CRD
  serviceMonitor:
    enabled: true

