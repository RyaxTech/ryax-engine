suite: Remote site linked through Skupper
templates:
  - templates/deployments.yaml
release:
  namespace: ryaxns
set:
  config.site.id: Site-1
tests:
  - it: is off by default, for a worker on the main site's cluster
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: RYAX_SKUPPER_NAMESPACE
          any: true
  - it: uses the release namespace when enabled
    set:
      skupper.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RYAX_SKUPPER_NAMESPACE
            value: ryaxns
  - it: uses the configured namespace
    set:
      skupper.enabled: true
      skupper.namespace: skupper
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: RYAX_SKUPPER_NAMESPACE
            value: skupper
