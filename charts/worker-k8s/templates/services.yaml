apiVersion: "v1"
kind: "Service"
metadata:
  name: {{ include "worker-k8s.fullname" .}}
  labels: {{- include "worker-k8s.labels" . | nindent 4 }}
spec:
  ports:
    - name: "api"
      port: {{ .Values.apiPort }}
    - name: "metrics"
      port: {{ .Values.metricsPort }}
  selector: {{- include "worker-k8s.selectorLabels" . | nindent 4 }}
